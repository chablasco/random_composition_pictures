<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CB Images Random Composition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    let bg = '#f1f1f1';
    let fg = '#000000';
    let accent = '#0000ff';

    let padding = 100;
    let numberOfImages = 5;
    let recentImages = [];
    let images = [];
    const totalImages = 158;
    let displayInterval = 2;

    function preload() {
      for (let i = 0; i < totalImages; i++) {
        images.push(loadImage(`asset/${i}.jpeg`));
      }
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      strokeCap(SQUARE);
      frameRate(1 / displayInterval);

      for (let i = 0; i < numberOfImages; i++) {
        recentImages.push(-1);
      }
    }

    function draw() {
      background(bg);

      for (let i = 0; i < numberOfImages; i++) {
        let imgSelector;
        do {
          imgSelector = int(random(totalImages));
        } while (recentImages.includes(imgSelector));

        recentImages[i] = imgSelector;

        let img = images[imgSelector];
        let imageSize = int(random(400, 500));
        img.resize(imageSize, 0);

        imageMode(CENTER);
        push();
        translate(random(padding, width - padding), random(padding, height - padding));
        image(img, 0, 0);
        pop();
      }
    }

    function mousePressed() {
      fullscreen(!fullscreen());
    }

    function keyPressed() {
      if (key === 's' || key === 'S') {
        saveCanvas('cb_composition', 'png');
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
